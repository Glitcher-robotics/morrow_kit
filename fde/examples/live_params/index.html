<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>값 조절 즉시 확인</title>
<style>
body{font:15px system-ui,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;color:#17303f}
h1{margin:0 0 4px}.sub{margin:0 0 16px;color:#58707e}
#controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:14px;background:#f2f6f8;border-radius:8px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px}
input,select,button{font:inherit;padding:7px;border:1px solid #b8c7d0;border-radius:6px;background:#fff}
label.changed span::after{content:" ● 기본값과 다름";color:#a35a00;font-size:12px}
.err{color:#a02121;font-size:12px;min-height:1em}
.bar{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
#status{color:#58707e}.cards{display:flex;gap:10px;flex-wrap:wrap}
.card{padding:8px 14px;border-radius:6px;background:#eef2f4}.card b{font-size:20px;margin-left:6px}
table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border-bottom:1px solid #d9e3e8;padding:8px;text-align:left}
.조치{color:#a02121;font-weight:600}.주의{color:#a35a00;font-weight:600}.정상{color:#2f6b3a}
pre{background:#f7f9fa;padding:10px;white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<h1>값 조절 즉시 확인</h1>
<p class="sub">합성 예시 데이터 · 값을 바꾸면 0.3초 뒤 서버가 다시 계산합니다. config.json은 기본값만 정하고 바뀌지 않습니다.</p>
<form id="controls" novalidate></form>
<div class="bar"><button id="reset" type="button">기본값으로</button><span id="status">불러오는 중…</span></div>
<p class="err" id="globalErr" role="alert"></p>
<div class="cards" id="cards"></div>
<p id="window"></p>
<table><thead><tr><th>설비</th><th>판정</th><th>근거</th><th>측정 수</th><th>최신(nm)</th></tr></thead><tbody id="rows"></tbody></table>
<h2>적용된 값 (근거 D-ID)</h2><pre id="applied"></pre>
<script src="/live.js"></script>
</body>
</html>
